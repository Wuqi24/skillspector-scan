name: skillspector-scan

on:
  workflow_dispatch:
    inputs:
      skill_path:
        description: 要扫描的技能路径（相对仓库根，默认整个仓库）
        required: false
        default: '.'
      mode:
        description: 扫描模式
        required: false
        default: full
        type: choice
        options:
          - prepublish
          - full
      run_regression:
        description: 运行完整回归测试（test.ps1，Windows，约 7 分钟）
        required: false
        default: true
        type: boolean
      build_docker:
        description: 验证 Docker 镜像构建与恶意夹具检出
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      skill_path:
        type: string
        required: false
        default: '.'
      mode:
        type: string
        required: false
        default: 'prepublish'
      run_regression:
        type: boolean
        required: false
        default: false
      build_docker:
        type: boolean
        required: false
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scanner (skillspector-scan)
        uses: actions/checkout@v4
        with:
          repository: Wuqi24/skillspector-scan
          ref: main
          path: scanner
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run skillspector-scan
        shell: pwsh
        run: |
          $path = "${{ inputs.skill_path }}"
          if ([string]::IsNullOrWhiteSpace($path)) { $path = '.' }
          $mode = "${{ inputs.mode }}"
          # 手动/引用默认 full（仓库自检 score=0）；prepublish 仅对真实发布源目录使用
          if ([string]::IsNullOrWhiteSpace($mode)) { $mode = 'full' }
          $scan = "$env:GITHUB_WORKSPACE/scanner/scripts/scan.ps1"
          if ($mode -eq 'full') {
            pwsh -NoProfile -File $scan -Path $path
          } else {
            pwsh -NoProfile -File $scan -Path $path -PrePublish
          }
          exit $LASTEXITCODE

  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run full regression (test.ps1)
        if: github.event_name == 'push' || inputs.run_regression
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/test.ps1
          exit $LASTEXITCODE

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        if: github.event_name == 'push' || inputs.build_docker
        run: docker build -t skillspector-scan -f docker/Dockerfile .
      - name: Verify evil fixture detection (expect score=100)
        if: github.event_name == 'push' || inputs.build_docker
        shell: bash
        run: |
          docker run --rm -v "$PWD/docker/fixtures/evil-test:/skills/evil-test:ro" skillspector-scan -Path /skills/evil-test 2>&1 | tee /tmp/evil-report.txt
          python3 - <<'EOF'
          import re
          t = open('/tmp/evil-report.txt', encoding='utf-8', errors='replace').read()
          t = re.sub(r'\x1b\[[0-9;]*[mK]', '', t)
          ok = 'score=100' in t
          print('OK evil detected score=100' if ok else 'FAIL score=100 not found')
          raise SystemExit(0 if ok else 1)
          EOF
